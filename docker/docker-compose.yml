version: "3.9"

services:
  comfyui:
    build:
      context: ..
      dockerfile: docker/comfyui.dockerfile
    runtime: nvidia
    ports:
      - "8188:8188"
    volumes:
      - ../models:/app/models:ro
      - ../workflows/comfyui:/app/user/default/workflows:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  audio:
    build:
      context: ..
      dockerfile: docker/audio.dockerfile
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change-me

  agents:
    build:
      context: ..
      dockerfile: docker/agents.dockerfile
    volumes:
      - ../projects:/app/projects
      - ../config:/app/config:ro
    command: ["python", "-m", "agents.orchestrator", "--idea", "Local AI video studio demo"]

volumes:
  n8n_data:
