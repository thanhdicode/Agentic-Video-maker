project:
  name: "AI Video Studio"
  output_dir: "projects"
  temp_dir: ".tmp"
  default_resolution: "1920x1080"
  default_fps: 30

paths:
  models: "models"
  workflows: "workflows/comfyui"
  projects: "projects"

comfyui:
  host: "http://localhost:8188"
  workflow_dir: "workflows/comfyui"

ollama:
  host: "http://localhost:11434"
  default_model: "qwen3:32b"
  fallback_model: "llama3.3:70b"

audio:
  sample_rate: 24000
  tts_model: "f5-tts"
  voice_cloning_model: "f5-tts"

video:
  i2v_model: "wan2.1-i2v-14b-480p"
  t2v_model: "wan2.1-t2v-14b"
  upscale_scale: 2
  target_fps: 60

subtitle:
  style: "animated_ass"
  max_chars_per_line: 40
  burn_subtitles: true

resolve:
  enabled: false
  resolution: "1920x1080"
  fps: 30
  color_science: "davinciYRGBColorManagedv2"
  render_format: "mp4"
  render_codec: "H264"
  audio_codec: "aac"
  render_name: "final_resolve"
  lut_path: ""

blender:
  enabled: false
  executable: ""              # empty = auto-find; or set BLENDER_EXECUTABLE env
  resolution: "1920x1080"
  fps: 30
  transition_frames: 0        # crossfade frames between clips (0 = hard cut)
  music_volume: 0.3
  narration_volume: 1.0
  text_overlay_enabled: true
  text_overlay_font_size: 80
  text_overlay_duration_sec: 2.0
  text_overlay_location: [0.5, 0.85]
  text_overlay_color: [1.0, 1.0, 1.0, 1.0]

shotcut:
  enabled: false
  executable: ""              # empty = auto-find; or set SHOTCUT_MELT env
  resolution: "1920x1080"
  fps: 30
  transition_frames: 15       # crossfade frames between clips (0 = hard cut)
  music_volume: 0.3
  narration_volume: 1.0

n8n:
  host: "http://localhost:5678"
  webhook_path: "/webhook/ai-video-studio"

mcp:
  config_file: "mcp/mcp_config.json"
  enabled_servers:
    - filesystem
    - ffmpeg
    - comfyui
