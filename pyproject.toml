[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio"
version = "0.1.0"
description = "Local-first agentic video production pipeline"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=2.0.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0,<2.0",
    "pillow>=10.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
audio = ["audiocraft>=1.3.0", "f5-tts>=0.6.0"]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "mcp*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
