project:
  id: "why-is-the-sky-blue"
  title: "Why Is the Sky Blue?"
  target_platform: "youtube"
  aspect_ratio: "16:9"
  resolution: "1280x720"
  fps: 30
  duration_seconds: 240
  language: "en"
  subtitle_languages:
    - "en"

audience:
  age_min: 6
  age_max: 12
  knowledge_level: "beginner"

content:
  script_path: "./script.md"
  reference_videos: []

style:
  category: "educational-cartoon"
  originality_required: true
  character_mode: "original"
  visual_density: "high"
  motion_level: "high"
  humor_level: "low"
  infographic_level: "medium"
  palette:
    primary: "#2196F3"
    secondary: "#FF9800"
    accent: "#FFEB3B"
    background: "#0D47A1"
  typography:
    title_font: "Arial"
    body_font: "Arial"
    max_font_size: 72
    safe_area_percent: 90

production:
  profile: "cpu-demo"
  mode: "auto"
  quality: "prototype"
  hardware_profile: "cpu"
  allow_cloud_api: true
  reuse_cached_assets: true
  regenerate_failed_scenes: false
  max_retries_per_scene: 1

voice:
  narrator_language: "en"
  narrator_style: "curious-friendly"
  multi_character: false
  default_voice: "en-US-AriaNeural"
  voice_cloning:
    enabled: false
    reference_audio: ""

models:
  image: "pollinations"
  image_to_video: "none"
  video_interpolation: "none"
  tts: "edge-tts"
  music: "none"
  sfx: "none"

delivery:
  burned_captions: true
  clean_master: true
  audio_stems: false
  thumbnail: false
  youtube_metadata: false
  vertical_version: false
  square_version: false
